
magefile.go
magefile_*.go {
    prep: "
        # verifying magefile
        mage -l
    "
}

modd.conf
**/*.go
!mage_*.go
!vendor/** {
    prep: "
        # run unit tests
        go test @dirmods
    "
}

modd.conf
**/*.swift {
    prep: "
        # build icon generator
        mage -v buildHelper \
        && ./build/icongen --fonts >/dev/null
    "
}

modd.conf
**/*.go
!**/*_test.go
!mage_*.go
icons/*
fonts/* {
	prep: "
		# build workflow
        go test @dirmods \
		&& mage -v build
	"
}